<button
  class="flex w-full cursor-pointer items-center gap-x-3 rounded-xl p-2 text-left text-on-primary hover:bg-on-primary/10"
  [matMenuTriggerFor]="userMenu">
  <img class="size-9 rounded-lg object-cover grayscale" [src]="avatarImageUrl()" alt="User avatar" />
  <div class="flex min-w-0 flex-auto flex-col select-none">
    <div class="truncate font-medium">
      {{ user()?.name }}
    </div>
    <div class="truncate text-on-primary/70">
      {{ user()?.email }}
    </div>
  </div>
  <mat-icon class="size-4" svgIcon="ellipsis-vertical" />
</button>

<mat-menu class="min-w-60" xPosition="before" yPosition="above" #userMenu="matMenu">
  <button class="py-2 [&>span]:flex [&>span]:items-center" mat-menu-item>
    <img class="size-9 rounded-lg object-cover" [src]="avatarImageUrl()" alt="User avatar" />
    <div class="ml-3 flex min-w-0 flex-auto flex-col select-none">
      <div class="truncate font-medium">
        {{ user()?.name }}
      </div>
      <div class="text-on-surface-variant truncate text-xs">{{ user()?.email }}</div>
    </div>
  </button>
  <a mat-menu-item [routerLink]="profileRoute()">
    <mat-icon svgIcon="user-round" />
    My profile
  </a>
  <mat-divider />
  <button mat-menu-item (click)="signOut()">
    <mat-icon svgIcon="log-out" />
    Sign Out
  </button>
</mat-menu>
