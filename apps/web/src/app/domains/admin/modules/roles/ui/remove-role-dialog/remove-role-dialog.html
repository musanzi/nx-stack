<h2 mat-dialog-title>Delete role</h2>

<mat-dialog-content>
  Are you sure you want to delete the role <strong>{{ data.role.name }}</strong
  >? This action cannot be undone.
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false">Cancel</button>
  <button matButton="filled" type="button" [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
