<div class="mx-auto flex w-full max-w-80 flex-col sm:min-w-80">
  <a
    href="/"
    class="mb-4 inline-flex items-center cursor-pointer text-primary-700 self-start text-sm font-medium underline-offset-4 hover:underline">
    <mat-icon class="mr-1 size-4" svgIcon="arrow-left"></mat-icon>
    Back home
  </a>

  <div class="text-4xl leading-tight flex items-center font-extrabold tracking-tight">
    <mat-icon class="mr-1 size-8 text-green-700" svgIcon="check"></mat-icon>
    Link sent
  </div>
  <div class="mt-3 font-medium text-neutral-600">
    If this email address is associated with an account, a reset link has been sent. The link expires in 15 minutes.
  </div>
  <div class="mt-4 text-sm font-medium text-neutral-500">
    Already reset your password?
    <a class="underline underline-offset-4 hover:underline text-primary-600" routerLink="/auth/sign-in"> Sign in </a>
  </div>

  <a
    class="mt-8 inline-flex items-center self-start text-sm font-medium underline underline-offset-4 hover:underline text-primary-600"
    routerLink="/auth/sign-in">
    <mat-icon class="mr-1 size-4" svgIcon="arrow-left"></mat-icon>
    <span>Back to sign in</span>
  </a>
</div>
