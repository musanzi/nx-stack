@defer (on immediate) {
  <div class="flex min-h-screen w-full flex-auto">
    <main class="flex min-w-0 flex-1 items-center justify-center bg-white p-4 sm:p-12">
      <router-outlet (activate)="updateContent()" />
    </main>

    <aside
      class="relative hidden min-h-screen min-w-0 flex-1 items-center justify-center overflow-hidden border-l bg-neutral-950 p-8 sm:px-12 md:flex">
      <svg
        class="pointer-events-none absolute inset-0"
        viewBox="0 0 960 540"
        width="100%"
        height="100%"
        preserveAspectRatio="xMidYMax slice"
        aria-hidden="true">
        <g class="text-neutral-700/25" fill="none" stroke="currentColor" stroke-width="100">
          <circle r="234" cx="196" cy="23" />
          <circle r="234" cx="790" cy="491" />
        </g>
      </svg>

      <svg
        class="absolute -top-16 -right-16 text-neutral-700"
        viewBox="0 0 220 192"
        width="220"
        height="192"
        fill="none"
        aria-hidden="true">
        <defs>
          <pattern id="auth-dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="4" height="4" fill="currentColor" />
          </pattern>
        </defs>
        <rect width="220" height="192" fill="url(#auth-dot-pattern)" />
      </svg>

      <div class="relative z-10 w-full max-w-2xl">
        <div class="text-5xl font-bold text-white">{{ content().asideTitle }}</div>
        <div class="mt-6 text-xl text-neutral-500">{{ content().asideDescription }}</div>
        <div class="mt-12 font-medium tracking-tight text-neutral-500">
          {{ content().asideFootnote }}
        </div>
      </div>
    </aside>
  </div>
} @placeholder {
  <app-page-loader />
} @loading {
  <app-page-loader />
}
